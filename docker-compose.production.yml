volumes:
  pg_data_production:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: 25andrey25/foodgram_backend
    env_file: .env
    depends_on:
      - db
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/media

  frontend:
    image: 25andrey25/foodgram_frontend
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
    depends_on:
      - backend

  gateway:
    image: 25andrey25/foodgram_gateway
    env_file: .env
    volumes:
      - static_volume:/staticfiles
      - media_volume:/app/media
    ports:
      - 8000:80
    depends_on:
      - backend
      - frontend
